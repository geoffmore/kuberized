apiVersion: v1
kind: Service
metadata:
  name: nextcloud-app-svc
  labels:
    app: nextcloud
    component: web
spec:
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: nextcloud
    component: web
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-app
  labels:
    app: nextcloud
    component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nextcloud
      component: web
  template:
    metadata:
      labels:
        app: nextcloud
        component: web
    spec:
      containers:
      - name: nextcloud
        image: nextcloud:14.0.3-apache
        #  Nextcloud Stuff
        env:
        - name: NEXTCLOUD_ADMIN_USER
          valueFrom: 
            configMapKeyRef:
              name: nextcloud-config
              key: nextcloud_admin_user
        - name: NEXTCLOUD_ADMIN_PASSWORD
          valueFrom: 
            configMapKeyRef:
              name: nextcloud-config
              key: nextcloud_admin_password
        # Database Stuff
        - name: SQLITE_DATABASE
          valueFrom: 
            configMapKeyRef:
              name: nextcloud-config
              key: db_name
        # Either the service needs to be set to ingress, or the
        # Pod should become aware of the node it's running on
        # to avoid the trusted domain issue
        # Add your own dns here
        #- name: NEXTCLOUD_TRUSTED_DOMAINS
          #value: "localhost nextcloud-app-svc"
        volumeMounts:
        - mountPath: /var/www/nextcloud/data
          name: nextcloud-data
        ports:
        - containerPort: 80
      volumes:
      - name: nextcloud-data
        emptyDir: {}
