apiVersion: v1
kind: Service
# Headless services are needed for db discovery
metadata:
  name: nextcloud-db
  labels:
    app: nextcloud
    component: database
    database: mysql
    flavor: mariadb
spec:
  ports:
  - port: 3306
    name: mysql
    targetPort: 3306
  selector:
    app: nextcloud
    component: database
    database: mysql
    flavor: mariadb
  type: ClusterIP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nextcloud-db
  labels:
    app: nextcloud
    component: database
    database: mysql
    flavor: mariadb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nextcloud
      component: database
      database: mysql
      flavor: mariadb
  serviceName: "nextcloud-db"
  template:
    metadata:
      labels:
        app: nextcloud
        component: database
        database: mysql
        flavor: mariadb
    spec:
      containers:
      - name: mariadb
        image: mariadb:latest
        #image: mariadb:10.3.8-bionic
        env:
        - name: MYSQL_DATABASE
          valueFrom: 
            configMapKeyRef:
              name: nextcloud-config
              key: db_name
        - name: MYSQL_USER
          valueFrom: 
            configMapKeyRef:
              name: nextcloud-config
              key: db_user
        - name: MYSQL_ROOT_PASSWORD
          valueFrom: 
            secretKeyRef:
              name: db-secret
              key: db_password
        ports:
        - containerPort: 3306
          name: mysql
        #readinessProbe:
        #  tcpSocket:
        #    port: 3306
        #  initialDelaySeconds: 5
        #  periodSeconds: 10
        #livenessProbe:
        #  tcpSocket:
        #    port: 3306
        #  initialDelaySeconds: 5
        #  periodSeconds: 10
        volumeMounts:
        - mountPath: /var/lib/mysql
          name: mysql-data
  volumeClaimTemplates: 
  - metadata:
      name: mysql-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "cka0-nfs0"
      resources:
        requests:
          storage: 5Gi
