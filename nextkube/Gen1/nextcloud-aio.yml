apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-aio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nextcloud-aio
  template:
    metadata:
      labels:
        app: nextcloud-aio

    spec:
      containers:
      - name: nextcloud
        image: nextcloud
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud
spec:
  selector:
    app: nextcloud-aio
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: NodePort
